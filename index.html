<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PLX ODE — an interactive 3D art installation exploring scaffolding, nature, and the climb." />
    <meta
      name="theme-color"
      content="#050505" />
    <link
      rel="canonical"
      href="https://ode.plxplxplx.com/" />
    <title>PLX ODE</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/favicon.svg" />
    <link
      rel="preload"
      href="assets/fonts/NHaasGroteskDSPro-55Rg.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <link
      rel="preload"
      href="assets/fonts/NHaasGroteskDSPro-35XLt.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <link
      rel="stylesheet"
      href="assets/css/styles.css?v=2" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="PLX ODE — 15–16 maj, Malmö Konstmuseum" />
    <meta
      property="og:description"
      content="PLX ODE — an interactive 3D art installation exploring scaffolding, nature, and the climb." />
    <meta
      property="og:image"
      content="https://ode.plxplxplx.com/assets/img/og.jpg" />
    <meta
      property="og:image:alt"
      content="PLX ODE JOY — 15–16 Maj, Malmö Konstmuseum" />
    <meta
      property="og:url"
      content="https://ode.plxplxplx.com/" />
    <meta
      property="og:type"
      content="website" />
    <meta
      property="og:locale"
      content="sv_SE" />
    <meta
      name="twitter:card"
      content="summary_large_image" />
    <meta
      name="twitter:site"
      content="@plxplxplx" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "PLX ODE",
        "description": "An interactive 3D art installation exploring scaffolding, nature, and the climb.",
        "image": "https://ode.plxplxplx.com/assets/img/og.jpg",
        "startDate": "2026-05-15",
        "endDate": "2026-05-16",
        "url": "https://ode.plxplxplx.com/",
        "location": {
          "@type": "Place",
          "name": "Malmö Konstmuseum",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Slottsgatan 33",
            "addressLocality": "Malmö",
            "addressRegion": "Kungsparken",
            "addressCountry": "SE"
          }
        },
        "offers": {
          "@type": "Offer",
          "url": "https://billetto.se/e/plx-ode-joy-biljetter-1856579"
        }
      }
    </script>
  </head>
  <body>
    <div
      id="loader"
      role="status"
      aria-live="polite">
      <div id="loader-pct">0%</div>
    </div>

    <a
      href="#main-content"
      class="skip-link"
      >Hoppa till innehåll</a
    >

    <header id="site-header">
      <nav
        id="header-nav"
        aria-label="Site navigation">
        <h1>
          <img
            src="assets/reference/heading.webp"
            alt="PLX ODE JOY — 15–16 Maj, Malmö Konstmuseum i Kungsparken Slottsg. 33"
            id="heading-img"
            width="728"
            height="474"
            fetchpriority="high" />
        </h1>
        <div id="nav-links">
          <a
            href="https://billetto.se/e/plx-ode-joy-biljetter-1856579"
            target="_blank"
            rel="noopener"
            class="nav-link"
            >Biljetter <span class="visually-hidden">(öppnas i ny flik)</span></a
          >
          <a
            href="https://instagram.com/plxplxplx"
            target="_blank"
            rel="noopener"
            class="nav-link"
            >Instagram <span class="visually-hidden">(öppnas i ny flik)</span></a
          >
          <button
            type="button"
            class="nav-link"
            id="lineup-btn">
            Lineup</button
          >
          <button
            type="button"
            class="nav-link"
            id="dinner-btn">
            Middag</button
          >
          <a
            href="mailto:info@plxplxplx.com"
            class="nav-link"
            >Kontakt</a>
        </div>
      </nav>
    </header>

    <aside id="site-logos" aria-label="Partners">
      <img src="assets/svg/Kulturrådet.svg" alt="Kulturrådet" />
      <img src="assets/svg/Galatea.svg" alt="Galatea" />
    </aside>

    <main
      id="main-content"
      tabindex="-1">
      <canvas
        id="viewport"
        width="960"
        height="540"
        tabindex="-1"
        aria-label="Interactive 3D scaffolding tower — scroll to explore"></canvas>
      <div
        id="scroll-fade"
        aria-hidden="true"></div>
      <button
        id="panel-close"
        class="panel-btn"
        aria-label="Close image viewer">
        &times;
      </button>
      <button
        id="panel-prev"
        class="panel-btn"
        aria-label="Previous image">
        &#8249;
      </button>
      <button
        id="panel-next"
        class="panel-btn"
        aria-label="Next image">
        &#8250;
      </button>
      <div
        id="panel-caption"
        aria-live="polite"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "./assets/js/vendor/three.module.min.js",
          "three/addons/": "./assets/js/vendor/addons/",
          "tweakpane": "./assets/js/vendor/tweakpane.min.js"
        }
      }
    </script>

    <script type="module">
      // Yield to the browser so the header/LCP image can paint before
      // the heavy Three.js scene begins executing on the main thread.
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      await import('./assets/js/main.js?v=2');
    </script>
  </body>
</html>
